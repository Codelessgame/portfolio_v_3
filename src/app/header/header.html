<div class="header-container">
  <mat-toolbar class="sticky">
    <button mat-button routerLink="/">{{ t('nav.home') }}</button>
    <button mat-button routerLink="/projects">{{ t('nav.projects') }}</button>
    
    <span class="spacer"></span>
    
    <button class="lang-segmented-pill" (click)="toggleLanguage()" [attr.aria-label]="currentLang() === 'en' ? 'Switch to Czech' : 'Přepnout do angličtiny'">
      <span class="lang-thumb" [class.is-cs]="currentLang() === 'cs'"></span>
      <span class="lang-label" [class.active]="currentLang() === 'en'">EN</span>
      <span class="lang-label" [class.active]="currentLang() === 'cs'">CZ</span>
    </button>
  </mat-toolbar>

  <!-- This is the new canvas for the animation -->
  <div class="animation-canvas">
    <h1 (mouseover)="startAnimation()">{{currentValue()}}</h1>
    <!-- The star component lives here, inside the canvas that will clip it -->
    <div class="sky">
      @for ( star of stars; track $index; let i = $index) {
          <app-star [index]="i"></app-star>
        }
    </div>
  </div>
</div>
